name: Run Supabase Migrations

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  migrate:
    name: Run SQL Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Guard: project ref must match the site-embedded project"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # The browser code embeds the project ref in its SUPA_URL. If the
          # secret points anywhere else, migrations silently fix the wrong
          # project — which is exactly how the "admin can't see users" bug
          # survived several "successful" CI runs. Refuse to proceed.
          # The committed runtime files carry a <PROJECT_REF> placeholder until
          # you substitute your real Supabase project ref into the pages. The guard
          # below only runs once that substitution is done: EXPECTED then resolves
          # to the real embedded ref and must equal the Actions secret.
          EXPECTED=$(grep -rhoE 'https://[A-Za-z0-9_-]+\.supabase\.co' public/*.html public/*.js | head -1 | sed -E 's|https://([A-Za-z0-9_-]+)\.supabase\.co|\1|')
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "⚠️  SUPABASE_PROJECT_REF secret is not set — skipping the project-ref guard."
            echo "    Set it in Settings → Secrets and variables → Actions (value: the ref embedded in the pages, e.g. the project ref from SUPA_URL."
            echo "    The migrations step below skips too until this secret is set."
            exit 0
          fi
          if [ "$EXPECTED" = "<PROJECT_REF>" ]; then
            echo "⚠️  Runtime files still use the <PROJECT_REF> placeholder — substitute"
            echo "    your Supabase ref (sed -i 's|<PROJECT_REF>|yourref|g' public/*.html public/chat-widget.js)"
            echo "    then rerun. (The SUPABASE_PROJECT_REF secret must match that ref.)"
            exit 0
          fi
          if [ "$SUPABASE_PROJECT_REF" != "$EXPECTED" ]; then
            echo "❌ SUPABASE_PROJECT_REF=$SUPABASE_PROJECT_REF but the site embeds project '$EXPECTED'."
            echo "   Fix the Actions secret (Settings → Secrets and variables → Actions) before rerunning."
            exit 1
          fi
          echo "✅ Project ref matches the embedded project: $EXPECTED"

      - name: Run all pending SQL migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "⚠️  SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets are not set."
            echo "    Skipping migrations. Add them under Settings → Secrets → Actions."
            exit 0
          fi
          echo "Running migrations on project: $SUPABASE_PROJECT_REF"
          # The Management API executeSql endpoint runs each statement as the
          # postgres superuser with just the access token + project ref.
          API="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
          FAILED=0
          for file in $(ls SQL/supabase/*.sql | sort); do
            echo "──────────────────────────────────────"
            echo "▶ Applying: $file"
            # Strip leading full-line SQL comments so the payload stays small.
            SQL=$(sed -E 's/^[[:space:]]*--.*$//' "$file" | tr -d '\r')
            HTTP=$(curl -s -o /tmp/migrate.out -w '%{http_code}' \
              -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(python3 -c "import json,sys; print(json.dumps({'query': sys.stdin.read()}))" <<< "$SQL")")
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]; then
              echo "✅ Done: $file"
            else
              echo "❌ FAILED ($HTTP): $file"
              head -c 500 /tmp/migrate.out
              echo
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "One or more migrations failed — the run is marked failed so the"
            echo "failure is visible instead of silently skipped."
            exit 1
          fi

      - name: Verify migrations are live on the embedded project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # Post-probe: the 008 RPC must actually exist on the target project.
          # Uses the (public, repo-embedded) anon key so this proves the whole
          # pipeline hit the right project, not just the CI secrets' project.
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Skipping verification (migrations were skipped)."
            exit 0
          fi
          # The committed runtime files carry a <SUPA_ANON_KEY> placeholder until
          # you substitute your real anon key;the probe below only runs once that
          # substitution is done.
          ANON_KEY=$(grep -rhoE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' public/chat-widget.js | head -1)
          if [ -z "$ANON_KEY" ] || [ "$ANON_KEY" = "<SUPA_ANON_KEY>" ]; then
            echo "Skipping live probe (placeholder anon key not configured)."
            exit 0
          fi
          # Call with the REAL param names (p_name/p_email/p_message) and empty
          # values: the function must reject with its 22023 validation error,
          # which (unlike PGRST202) proves it exists without writing junk rows.
          BODY=$(curl -s -X POST "https://$SUPABASE_PROJECT_REF.supabase.co/rest/v1/rpc/create_guest_ticket" \
            -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
            -d '{"p_name":"","p_email":"","p_message":""}')
          if echo "$BODY" | grep -q 'PGRST202'; then
            echo "❌ create_guest_ticket is NOT available on $SUPABASE_PROJECT_REF —"
            echo "   migrations did not land there. Check the project ref guard above."
            echo "$BODY"
            exit 1
          fi
          echo "✅ Live probe OK — create_guest_ticket exists on $SUPABASE_PROJECT_REF"
          echo "Response: ${BODY:0:400}"

  deploy-function:
    name: Deploy register Edge Function
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy register function + set env secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPA_SERVICE_ROLE_KEY: ${{ secrets.SUPA_SERVICE_ROLE_KEY }}
        run: |
          # Optional — registers the Edge Function that register.html prefers. Skip
          # cleanly until the SUPA_SERVICE_ROLE_KEY secret is added (no breakage).
          # One-time secret setup (Settings → Secrets and variables → Actions):
          #   SUPA_SERVICE_ROLE_KEY = your Supabase *service_role* key (BYPASSES RLS —
          #   never commit it; CI injects it at runtime only).
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPA_SERVICE_ROLE_KEY" ]; then
            echo "⏭️  Skipping function deploy (SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF / SUPA_SERVICE_ROLE_KEY not all set)."
            exit 0
          fi
          command -v supabase >/dev/null 2>&1 || (curl -sSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz -o /tmp/supabase.tar.gz && tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin supabase)
          supabase functions deploy register \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api --yes
          # Set the function's env secrets (values from the actions secrets, server-side only).
          # Management API: POST /v1/projects/{ref}/functions/{slug}/secrets
          # accepts {"name","value"}; older shape lavours a PUT with an array. Try
          # POST first,and fall back to PUT if the endpoint rejects it (404/405).
          set_secret() {
            local name="$1" value="$2"
            local resp code
            resp=$(curl -sS -w '\n%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/functions/register/secrets" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$name\",\"value\":\"$value\"}")
            code=${resp##*$'\n'}
            if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "204" ]; then
              echo "  secret $name: OK (POST $code)"
            else
              echo "  secret $name: POST gave $code — trying PUT"
              resp=$(curl -sS -w '\n%{http_code}' -X PUT \
                "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/functions/register/secrets" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d "[{\"name\":\"$name\",\"value\":\"$value\"}]")
              code=${resp##*$'\n'}
              echo "  secret $name: PUT gave $code"
            fi
          }
          set_secret "SUPABASE_URL" "https://$SUPABASE_PROJECT_REF.supabase.co"
          set_secret "SUPA_SERVICE_ROLE_KEY" "$SUPA_SERVICE_ROLE_KEY"
          echo "✅ register function deployed + secrets set on $SUPABASE_PROJECT_REF"
